# OpenCode Dashboard — nginx reverse proxy
# Place at: /etc/nginx/sites-available/opencode-dashboard
# Then symlink: ln -s /etc/nginx/sites-available/opencode-dashboard /etc/nginx/sites-enabled/
#
# IMPORTANT: www-data must be able to traverse the dist path.
# Run once after deploy:
#   chmod o+x /root /root/code_projects /root/code_projects/opencode-dashboard \
#              /root/code_projects/opencode-dashboard/apps \
#              /root/code_projects/opencode-dashboard/apps/web \
#              /root/code_projects/opencode-dashboard/apps/web/dist
#   chmod -R o+r /root/code_projects/opencode-dashboard/apps/web/dist

# ── Upstream (Bun server) with keepalive ───────────────────────────
# A keepalive pool lets nginx reuse warm TCP connections to Bun instead of
# opening a fresh one per request. On the API path this removes a connect()
# round-trip from every call; for the terminal it keeps the upstream leg hot
# while sessions reconnect.
upstream opencode_backend {
    server localhost:3001;
    keepalive 32;
    keepalive_timeout 60s;
}

# ── HTTP → HTTPS redirect ──────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name example.com;  # ← REPLACE with your domain

    # Let's Encrypt challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# ── HTTPS server ───────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com;  # ← REPLACE with your domain

    # SSL certificates (Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Static files served directly by nginx — no Bun overhead for assets
    root /root/code_projects/opencode-dashboard/apps/web/dist;

    # Content-hashed assets: cache aggressively (filenames include build hash)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── API routes → Bun server ─────────────────────────────────────
    location /api/ {
        proxy_pass http://opencode_backend;
        proxy_http_version 1.1;
        # Required for upstream keepalive: clear the Connection header so nginx
        # does not forward "close" and can reuse the pooled connection.
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── WebSocket upgrade (terminal sessions) ──────────────────────
    location /terminal/ {
        proxy_pass http://opencode_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # ── Interactive-latency tuning (terminal keystroke echo) ──
        # Without these, nginx buffers PTY output and Nagle's algorithm
        # coalesces small keystroke frames, adding up to ~40-200ms of
        # perceived typing lag. Disabling buffering + enabling tcp_nodelay
        # forwards each frame immediately — required for a local-feeling TUI.
        proxy_buffering off;
        proxy_request_buffering off;
        tcp_nodelay on;
        # Keep the upstream TCP leg alive so kernel-level dead-peer detection
        # cleans up half-open PTY connections across reconnects.
        proxy_socket_keepalive on;
    }

    # ── WebSocket upgrade (global session-events channel) ──────────
    # Push-only channel: server broadcasts session list changes
    # (created/closed/renamed/cleared/exited). Replaces HTTP polling.
    location /ws/events {
        proxy_pass http://opencode_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── SPA fallback ────────────────────────────────────────────────
    # Serve static files if they exist; otherwise serve index.html so
    # React Router handles client-side navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Gzip compression ───────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;
}
