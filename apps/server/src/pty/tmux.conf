# ALF transparent tmux config.
#
# Every session hosts exactly ONE TUI (claude/opencode) and is driven by a
# single `tmux -C` control client (the browser, via xterm.js). The goal is a
# pristine, invisible tmux: the TUI must believe it owns a raw terminal.
#
# Passed to every tmux invocation with `tmux -f <this file> ...` from the
# server (see apps/server/src/pty/tmux.ts).

# No status bar — the TUI owns the full screen.
set -g status off

# Don't hijack keystrokes: disable the prefix entirely so EVERY key reaches
# the TUI (claude/opencode bind their own keys, including C-b).
set -g prefix None
unbind C-b

# ESC must be instant. TUIs distinguish a lone ESC from an escape sequence by
# timing; any delay reintroduces key latency and breaks vim-style modes.
# NON-NEGOTIABLE — do not raise above 0.
set -sg escape-time 0

# Generous scrollback for history (buffer replay is handled separately).
set -g history-limit 100000

# One client per session: follow the connected client's size exactly so a
# reattach/resize repaints at the true cols x rows.
setw -g aggressive-resize on
set -g window-size latest

# Truecolor / 256-color passthrough so the TUI renders full color.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ",xterm*:Tc"

# Clipboard (OSC 52) passthrough + focus reporting — TUIs want both.
set -g set-clipboard on
set -g focus-events on

# Mouse OFF: claude/opencode handle their own mouse events. tmux mouse mode
# would intercept scroll/selection and fight the TUI. (Revisit per §4/Q5 if a
# TUI needs tmux-level mouse.)
set -g mouse off

# Keep session/window names stable (we address sessions by name).
set -g allow-rename off
set -g automatic-rename off

# When the inner program exits, close its window. The inner command ends with
# `exec zsh || exec bash`, so a real exit only happens when the user quits the
# fallback shell — at which point the session should end.
set -g remain-on-exit off
