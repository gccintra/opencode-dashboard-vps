name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy webhook
        run: |
          curl -X POST https://gcsoftware.tech/api/deploy \
            -H "x-deploy-token: ${{ secrets.DEPLOY_TOKEN }}" \
            -f --max-time 180
