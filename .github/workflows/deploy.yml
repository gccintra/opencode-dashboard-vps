name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: prod
    steps:
      - uses: actions/checkout@v4
      - name: Install & Build
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Restart production
        run: pm2 restart opencode-dashboard
