name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: prod
    steps:
      - name: Pull latest changes
        working-directory: /root/code_projects/opencode-dashboard
        run: git pull origin main
      - name: Install & Build
        working-directory: /root/code_projects/opencode-dashboard
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Restart production
        run: pm2 restart opencode-dashboard
